<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月面基地 通信システム</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: #030712;
      color: #00f3ff;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    .header {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f3ff;
      border-bottom: 2px solid #00f3ff;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .status-box { font-size: 15px; color: #ffb700; margin-bottom: 15px; }
    
    .delay-control {
      background: rgba(10, 25, 47, 0.8);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 10px;
      margin: 10px auto 20px;
      max-width: 600px;
    }
    .delay-control label { font-size: 14px; margin-right: 10px; }
    .btn-delay {
      background: #0a192f;
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      margin: 2px;
    }
    .btn-delay.active {
      background: #00f3ff;
      color: #030712;
      font-weight: bold;
      box-shadow: 0 0 8px #00f3ff;
    }

    .main-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .video-card {
      background: rgba(10, 25, 47, 0.9);
      border: 2px solid #00f3ff;
      border-radius: 10px;
      padding: 15px;
      width: 45%;
      min-width: 320px;
      box-shadow: 0 0 15px rgba(0,243,255,0.2);
      box-sizing: border-box;
    }
    
    .panel-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: 8px;
      background-image: url('moon.png');
      background-size: cover;
      background-position: center;
    }

    .astronaut-img {
      position: absolute;
      bottom: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      height: auto;
      z-index: 1;
      pointer-events: none;
    }

    .face-video {
      position: absolute;
      top: 23%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      height: 38%;
      object-fit: cover;
      border-radius: 50% / 45%;
      z-index: 2;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    /* バックグラウンド動作用の隠しビデオ要素 */
    .hidden-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px auto;
      background: #fff;
      padding: 10px;
      border-radius: 5px;
      width: fit-content;
    }
    .btn {
      background: #00f3ff;
      color: #030712;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 10px;
    }
    .btn:hover { background: #fff; box-shadow: 0 0 10px #00f3ff; }
  </style>
</head>
<body>

  <div class="header">🌕 月面基地 通信指令室 (LUNAR BASE)</div>
  <div id="status" class="status-box">システム初期化中...「通信起動」を押してください</div>

  <div class="delay-control">
    <label>⏱️ 通信遅延（タイムラグ）設定:</label>
    <button class="btn-delay active" onclick="setDelay(3, this)">3秒 (月面)</button>
    <button class="btn-delay" onclick="setDelay(5, this)">5秒 (月面遠隔)</button>
    <button class="btn-delay" onclick="setDelay(10, this)">10秒 (火星近心)</button>
  </div>

  <button class="btn" onclick="initHost()">📡 月面基地（親機）として通信開始</button>

  <div id="qr-section" style="display:none;">
    <p>【保護者のスマホで以下のQRコードを読み取ってください】</p>
    <div id="qrcode"></div>
  </div>

  <div class="main-container">
    <div class="video-card">
      <h3>【月面パイロット (自分・リアルタイム)】</h3>
      <div class="panel-frame">
        <video id="localVideo" class="face-video" autoplay playsinline muted></video>
        <img src="astronaut.png" class="astronaut-img" alt="宇宙飛行士">
      </div>
    </div>
    <div class="video-card">
      <h3 id="remote-title">【地球（相手）からの映像 - 3秒遅延】</h3>
      <div class="panel-frame" style="background:#000;">
        <canvas id="delayCanvas" style="width:100%; height:100%; object-fit:cover;"></canvas>
        <video id="remoteVideo" class="hidden-video" autoplay playsinline muted></video>
      </div>
    </div>
  </div>

  <script>
    let peer, localStream;
    let delaySeconds = 3.0;
    let frameBuffer = [];
    let isDelayRunning = false;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    function setDelay(sec, btn) {
      delaySeconds = sec;
      frameBuffer = [];
      
      document.querySelectorAll('.btn-delay').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const remoteTitle = document.getElementById('remote-title');
      if (remoteTitle) {
        remoteTitle.innerText = `【地球（相手）からの映像 - ${sec}秒遅延】`;
      }
      
      const status = document.getElementById('status');
      if (status) {
        status.innerText = `⏱️ 通信遅延を【${sec}秒】に切り替えました`;
      }
    }

    async function initHost() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('status').innerText = "通信ID発行中...";

        peer = new Peer(peerConfig);

        peer.on('open', (id) => {
          document.getElementById('status').innerText = "🟢 月面基地準備完了！スマホでQRコードを読み取ってください";
          document.getElementById('qr-section').style.display = 'block';

          const clientUrl = `${location.protocol}//${location.host}${location.pathname}?join=${id}`;
          document.getElementById("qrcode").innerHTML = "";
          new QRCode(document.getElementById("qrcode"), { text: clientUrl, width: 160, height: 160 });
        });

        peer.on('call', (call) => {
          document.getElementById('status').innerText = "📡 接続完了！通信中...";
          call.answer(localStream);

          call.on('stream', (remoteStream) => {
            const vid = document.getElementById('remoteVideo');
            vid.srcObject = remoteStream;
            vid.play().then(() => {
              startDelayProcess('remoteVideo', 'delayCanvas');
            }).catch(e => console.error("再生エラー:", e));
          });
        });

      } catch (err) {
        alert("カメラ/マイクの許可が必要です: " + err);
      }
    }

    function startDelayProcess(videoCtxId, canvasId) {
      if (isDelayRunning) return;
      isDelayRunning = true;

      const video = document.getElementById(videoCtxId);
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const processFrame = () => {
        if (video && video.videoWidth > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = video.videoWidth;
          tempCanvas.height = video.videoHeight;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(video, 0, 0);

          frameBuffer.push({
            time: Date.now(),
            image: tempCanvas
          });

          const targetTime = Date.now() - (delaySeconds * 1000);
          while (frameBuffer.length > 0 && frameBuffer[0].time <= targetTime) {
            const frame = frameBuffer.shift();
            ctx.drawImage(frame.image, 0, 0);
          }
        }
        requestAnimationFrame(processFrame);
      };
      requestAnimationFrame(processFrame);
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const joinId = urlParams.get('join');

      if (joinId) {
        document.body.innerHTML = `
          <div class="header">🌍 地球通信局 (EARTH STATION)</div>
          <div id="status" class="status-box">月面基地へ接続準備中...</div>
          <button class="btn" onclick="connectToMoon('${joinId}')">🚀 月面へ接続開始</button>
          <div class="main-container">
            <div class="video-card" style="width:90%;">
              <h3>【月面宇宙飛行士からの映像】</h3>
              <div class="panel-frame">
                <canvas id="delayCanvas" class="face-video"></canvas>
                <video id="remoteVideo" class="hidden-video" autoplay playsinline muted></video>
                <img src="astronaut.png" class="astronaut-img" alt="宇宙飛行士">
              </div>
            </div>
          </div>
        `;
      }
    };

    async function connectToMoon(hostId) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const mobilePeer = new Peer(peerConfig);

        mobilePeer.on('open', () => {
          document.getElementById('status').innerText = "📡 送信中...";
          const call = mobilePeer.call(hostId, stream);

          call.on('stream', (remoteStream) => {
            document.getElementById('status').innerText = "🟢 月面基地と接続完了！";
            const vid = document.getElementById('remoteVideo');
            vid.srcObject = remoteStream;
            vid.play().then(() => {
              startDelayProcess('remoteVideo', 'delayCanvas');
            }).catch(e => console.error("再生エラー:", e));
          });
        });
      } catch(e) {
        alert("スマホのカメラ・マイクの許可が必要です: " + e);
      }
    }
  </script>
</body>
</html>
